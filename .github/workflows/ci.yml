name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Check whether engine patches changed
        id: patch-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$BASE_REF"
            git diff --name-only "origin/$BASE_REF...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "$BEFORE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          else
            git fetch origin main
            git diff --name-only origin/main...HEAD > "$RUNNER_TEMP/changed-files.txt"
          fi
          if grep -q '^phase-patches/' "$RUNNER_TEMP/changed-files.txt"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply local engine patches for formatting
        if: steps.patch-changes.outputs.changed == 'true'
        run: ./scripts/apply-phase-patches.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-19
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.10
      - run: cargo fmt --check
      - name: Check patched engine formatting
        if: steps.patch-changes.outputs.changed == 'true'
        working-directory: phase
        run: cargo fmt --all --check
      - run: ruff format --check driver scripts tests --exclude driver/diff_game.py

  clippy:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Check whether engine patches changed
        id: patch-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$BASE_REF"
            git diff --name-only "origin/$BASE_REF...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "$BEFORE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          else
            git fetch origin main
            git diff --name-only origin/main...HEAD > "$RUNNER_TEMP/changed-files.txt"
          fi
          if grep -q '^phase-patches/' "$RUNNER_TEMP/changed-files.txt"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply local engine patches
        run: ./scripts/apply-phase-patches.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-19
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: clippy-${{ hashFiles('phase-patches/*.patch') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.10
      - name: Clippy patched phase engine
        if: steps.patch-changes.outputs.changed == 'true'
        working-directory: phase
        run: cargo clippy -p phase-engine --all-targets -- -D warnings
      - run: cargo clippy --workspace -- -D warnings
      - run: ruff check driver scripts tests
      - run: cargo build --release -p phase-env

  test-full:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply local engine patches
        run: ./scripts/apply-phase-patches.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-19
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: phase -> target
          shared-key: test-full-${{ hashFiles('phase-patches/*.patch') }}
      - name: Download and verify matching patched card data
        working-directory: phase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t card_data < ../ci/card-data.txt
          if [[ "${#card_data[@]}" -ne 2 ]]; then
            echo "::error::ci/card-data.txt must contain exactly a release tag and SHA-256"
            exit 1
          fi
          tag="${card_data[0]}"
          expected_sha="${card_data[1]}"
          if [[ -z "$tag" || ! "$expected_sha" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::ci/card-data.txt contains an invalid release tag or SHA-256"
            exit 1
          fi
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p 'card-data.json*' -D "$RUNNER_TEMP"
          shopt -s nullglob
          assets=("$RUNNER_TEMP"/card-data.json*)
          if [[ "${#assets[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one card-data.json release asset, found ${#assets[@]}"
            exit 1
          fi
          downloaded="${assets[0]}"
          case "$downloaded" in
            *.json.gz)
              gzip --decompress --stdout "$downloaded" > "$RUNNER_TEMP/card-data.json"
              data_file="$RUNNER_TEMP/card-data.json"
              ;;
            *.json)
              data_file="$downloaded"
              ;;
            *)
              echo "::error::Unsupported card-data release asset: $downloaded"
              exit 1
              ;;
          esac
          actual_sha="$(sha256sum "$data_file" | cut -d' ' -f1)"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "::error::Patched card-data SHA-256 mismatch: expected $expected_sha, got $actual_sha"
            exit 1
          fi
          install -D "$data_file" client/public/card-data.json
          echo "Installed patched card data with SHA-256 $actual_sha"
      - name: Run the complete phase-engine suite
        working-directory: phase
        run: |
          set -o pipefail
          cargo test -p phase-engine 2>&1 | tee "$RUNNER_TEMP/phase-engine-test.log"
      - name: Enforce the test-count floor
        working-directory: phase
        run: |
          test_floor="$(tr -d '[:space:]' < ../ci/test-floor.txt)"
          if [[ ! "$test_floor" =~ ^[0-9]+$ ]]; then
            echo "::error::ci/test-floor.txt must contain one non-negative integer"
            exit 1
          fi
          python ../scripts/check_test_count.py "$RUNNER_TEMP/phase-engine-test.log" --min "$test_floor"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.4.2
      - name: Compile Python sources
        run: python -m compileall -q driver scripts tests
      - name: Run Python tests
        run: python -m pytest driver tests -q
      - name: Upload full engine test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-engine-full-suite
          path: ${{ runner.temp }}/phase-engine-test.log
          if-no-files-found: ignore

  xmage-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Detect XMage scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$BASE_REF"
            git diff --name-only "origin/$BASE_REF...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "$BEFORE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          else
            git fetch origin main
            git diff --name-only origin/main...HEAD > "$RUNNER_TEMP/changed-files.txt"
          fi
          if ! grep -Eq '^(phase-patches/|phase(/|$)|phase-env/|oracle/|driver/diff_game\.py$|([^/]+/)*card-data[^/]*\.json$)' "$RUNNER_TEMP/changed-files.txt"; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "No XMage-gated paths changed."
          elif [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "mode=smoke" >> "$GITHUB_OUTPUT"
          else
            cards_mode="$(python3 - <<'PY'
          import os

          from scripts.check_review_packet import parse_cards_line

          cards = parse_cards_line(os.environ.get("PR_BODY", ""))
          if cards is None:
              print("missing")
          elif cards.casefold() == "none":
              print("none")
          else:
              print("listed")
          PY
          )"
            if [[ "$cards_mode" == "none" ]]; then
              echo "mode=smoke" >> "$GITHUB_OUTPUT"
            else
              echo "mode=fail-closed" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Fail closed for per-card XMage changes until harness v1
        if: steps.scope.outputs.mode == 'fail-closed'
        run: |
          echo "::error::xmage-diff not implemented yet; see docs/harness-v1-plan.md"
          exit 1
      - name: Read pinned mage-bench revision
        id: mage-bench-pin
        if: steps.scope.outputs.mode == 'smoke'
        run: |
          mapfile -t pin < oracle/mage-bench.txt
          if [[ "${#pin[@]}" -ne 2 ]]; then
            echo "::error::oracle/mage-bench.txt must contain a repository URL and commit SHA"
            exit 1
          fi
          repo_url="${pin[0]}"
          repo="${repo_url#https://github.com/}"
          sha="${pin[1]}"
          if [[ "$repo_url" != https://github.com/* || "$repo" != */* ]]; then
            echo "::error::oracle/mage-bench.txt must contain a GitHub repository URL"
            exit 1
          fi
          if [[ ! "$sha" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::oracle/mage-bench.txt must contain a full commit SHA"
            exit 1
          fi
          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.scope.outputs.mode == 'smoke'
        with:
          repository: ${{ steps.mage-bench-pin.outputs.repository }}
          ref: ${{ steps.mage-bench-pin.outputs.sha }}
          path: mage-bench
          fetch-depth: 1
      - uses: actions/setup-java@v4
        if: steps.scope.outputs.mode == 'smoke'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: mage-bench/**/pom.xml
      - name: Apply local external-pilot patch
        if: steps.scope.outputs.mode == 'smoke'
        run: |
          (cd mage-bench && git apply ../oracle/patches/mage-bench-external-pilot.patch)
      - name: Cache mage-bench build output
        if: steps.scope.outputs.mode == 'smoke'
        uses: actions/cache@v4
        with:
          path: mage-bench/**/target
          key: mage-bench-${{ runner.os }}-${{ steps.mage-bench-pin.outputs.sha }}-${{ hashFiles('oracle/patches/mage-bench-external-pilot.patch') }}
      - name: Build mage-bench
        if: steps.scope.outputs.mode == 'smoke'
        working-directory: mage-bench
        run: mvn install package -DskipTests
      - uses: astral-sh/setup-uv@v6
        if: steps.scope.outputs.mode == 'smoke'
        with:
          enable-cache: true
          cache-dependency-glob: mage-bench/uv.lock
      - name: Install mage-bench Python dependencies
        if: steps.scope.outputs.mode == 'smoke'
        working-directory: mage-bench
        run: uv sync --locked
      - name: Apply local engine patches
        if: steps.scope.outputs.mode == 'smoke'
        run: ./scripts/apply-phase-patches.sh
      - uses: dtolnay/rust-toolchain@master
        if: steps.scope.outputs.mode == 'smoke'
        with:
          toolchain: nightly-2026-04-19
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.mode == 'smoke'
        with:
          workspaces: . -> target
          shared-key: xmage-diff-${{ hashFiles('phase-patches/*.patch') }}
      - name: Download and verify matching patched card data
        if: steps.scope.outputs.mode == 'smoke'
        working-directory: phase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t card_data < ../ci/card-data.txt
          if [[ "${#card_data[@]}" -ne 2 ]]; then
            echo "::error::ci/card-data.txt must contain exactly a release tag and SHA-256"
            exit 1
          fi
          tag="${card_data[0]}"
          expected_sha="${card_data[1]}"
          if [[ -z "$tag" || ! "$expected_sha" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::ci/card-data.txt contains an invalid release tag or SHA-256"
            exit 1
          fi
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p 'card-data.json*' -D "$RUNNER_TEMP"
          shopt -s nullglob
          assets=("$RUNNER_TEMP"/card-data.json*)
          if [[ "${#assets[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one card-data.json release asset, found ${#assets[@]}"
            exit 1
          fi
          downloaded="${assets[0]}"
          case "$downloaded" in
            *.json.gz)
              gzip --decompress --stdout "$downloaded" > "$RUNNER_TEMP/card-data.json"
              data_file="$RUNNER_TEMP/card-data.json"
              ;;
            *.json)
              data_file="$downloaded"
              ;;
            *)
              echo "::error::Unsupported card-data release asset: $downloaded"
              exit 1
              ;;
          esac
          actual_sha="$(sha256sum "$data_file" | cut -d' ' -f1)"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "::error::Patched card-data SHA-256 mismatch: expected $expected_sha, got $actual_sha"
            exit 1
          fi
          install -D "$data_file" client/public/card-data.json
          echo "Installed patched card data with SHA-256 $actual_sha"
      - name: Build phase-env
        if: steps.scope.outputs.mode == 'smoke'
        run: cargo build --release -p phase-env
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.mode == 'smoke'
        with:
          python-version: "3.12"
      - name: Run two-seed mono-green differential smoke
        if: steps.scope.outputs.mode == 'smoke'
        env:
          MAGE_BENCH_ROOT: ${{ github.workspace }}/mage-bench
        run: |
          failed=0
          for seed in 17 42; do
            if ! python driver/diff_game.py oracle/decks/mono-green-v0.txt \
              oracle/decks/mono-green-v0.txt --seed "$seed" \
              --data-root phase/client/public; then
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.mode == 'smoke'
        with:
          name: xmage-diff-runs
          path: runs/
          if-no-files-found: warn

  mutants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      MUTANTS_THRESHOLD_FILE: ${{ github.workspace }}/ci/mutants-threshold.txt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Check whether engine patches changed
        id: patch-changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          git diff --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed-files.txt"
          if grep -q '^phase-patches/' "$RUNNER_TEMP/changed-files.txt"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Free runner disk space
        if: steps.patch-changes.outputs.changed == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force || true
          df -h /
      - name: Install mutation toolchain
        if: steps.patch-changes.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-19
      - name: Install cargo-mutants
        if: steps.patch-changes.outputs.changed == 'true'
        run: cargo install cargo-mutants --locked --version 27.1.0
      - name: Build patched base and head phase trees
        if: steps.patch-changes.outputs.changed == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          base_commit="$(git rev-parse "origin/$BASE_REF")"
          head_commit="$GITHUB_SHA"
          base_phase="$(git rev-parse "$base_commit:phase")"
          head_phase="$(git rev-parse "$head_commit:phase")"
          base_tree="$RUNNER_TEMP/phase-base"
          head_tree="$RUNNER_TEMP/phase-head"
          git -C phase fetch --no-tags origin "$base_phase" || true
          git -C phase fetch --no-tags origin "$head_phase" || true
          git -C phase worktree add --detach "$base_tree" "$base_phase"
          git -C phase worktree add --detach "$head_tree" "$head_phase"
          mkdir "$RUNNER_TEMP/base-source" "$RUNNER_TEMP/head-source"
          git archive "$base_commit" phase-patches | tar -x -C "$RUNNER_TEMP/base-source"
          mkdir "$RUNNER_TEMP/base-patches"
          cp "$RUNNER_TEMP/base-source/phase-patches/"*.patch "$RUNNER_TEMP/base-patches/"
          git archive "$head_commit" phase-patches | tar -x -C "$RUNNER_TEMP/head-source"
          mkdir "$RUNNER_TEMP/head-patches"
          cp "$RUNNER_TEMP/head-source/phase-patches/"*.patch "$RUNNER_TEMP/head-patches/"
          (
            cd "$base_tree"
            git -c user.name=CI -c user.email=ci@example.invalid am "$RUNNER_TEMP"/base-patches/*.patch
          )
          (
            cd "$head_tree"
            git -c user.name=CI -c user.email=ci@example.invalid am "$RUNNER_TEMP"/head-patches/*.patch
          )
          base_patched="$(git -C "$base_tree" rev-parse HEAD)"
          head_patched="$(git -C "$head_tree" rev-parse HEAD)"
          git -C "$head_tree" diff --no-ext-diff "$base_patched" "$head_patched" -- crates/ > "$RUNNER_TEMP/engine-changes.diff"
          echo "BASE_PATCHED=$base_patched" >> "$GITHUB_ENV"
          echo "HEAD_PATCHED=$head_patched" >> "$GITHUB_ENV"
          echo "BASE_TREE=$base_tree" >> "$GITHUB_ENV"
          echo "HEAD_TREE=$head_tree" >> "$GITHUB_ENV"
      - name: Run changed-line mutation tests
        if: steps.patch-changes.outputs.changed == 'true'
        working-directory: ${{ runner.temp }}/phase-head
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/phase-mutants-target
        run: |
          set -o pipefail
          test_filter=()
          changed_modules="$(git diff --name-only "$BASE_PATCHED" "$HEAD_PATCHED" -- crates/engine/tests/integration)"
          if [[ "$(printf '%s\n' "$changed_modules" | sed '/^$/d' | wc -l)" -eq 1 ]]; then
            module="$(basename "$changed_modules" .rs)"
            if [[ "$module" =~ ^[a-zA-Z0-9_]+$ ]]; then
              test_filter=("$module")
            fi
          fi
          set +e
          cargo mutants \
            --in-diff "$RUNNER_TEMP/engine-changes.diff" \
            -p phase-engine \
            --cargo-arg=--test \
            --cargo-arg=integration \
            --jobs 2 \
            --timeout 60 \
            --build-timeout 300 \
            --output "$RUNNER_TEMP/mutants.out" \
            -- "${test_filter[@]}" \
            2>&1 | tee "$RUNNER_TEMP/mutants.log"
          mutants_status=${PIPESTATUS[0]}
          set -e
          missed_count="$(grep -c '^MISSED ' "$RUNNER_TEMP/mutants.log" || true)"
          threshold="$(tr -d '[:space:]' < "$MUTANTS_THRESHOLD_FILE")"
          if [[ ! "$threshold" =~ ^[0-9]+$ ]]; then
            echo "::error::ci/mutants-threshold.txt must contain one non-negative integer"
            exit 1
          fi
          echo "Missed mutants: $missed_count; allowed threshold: $threshold"
          if [[ "$missed_count" -gt "$threshold" ]]; then
            echo "::error::Missed mutant count exceeds ci/mutants-threshold.txt"
            grep '^MISSED ' "$RUNNER_TEMP/mutants.log" || true
            exit 1
          fi
          if [[ "$mutants_status" != 0 && "$mutants_status" != 2 && "$mutants_status" != 3 ]]; then
            echo "::error::cargo mutants failed with exit status $mutants_status"
            exit "$mutants_status"
          fi
          echo "Missed mutants are within threshold; timeouts and unviable mutants are non-failing."
      - name: Upload mutation results and survivors
        if: always() && steps.patch-changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changed-line-mutation-results
          path: |
            ${{ runner.temp }}/mutants.out/
            ${{ runner.temp }}/mutants.log
          if-no-files-found: ignore

  packet-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          git diff --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed-files.txt"
      - name: Lint review packet
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/check_review_packet.py --changed-files "$RUNNER_TEMP/changed-files.txt"
