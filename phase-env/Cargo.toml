[package]
name = "phase-env"
version = "0.1.0"
edition = "2021"
description = "JSONL decision-point driver for the phase-rs MTG engine (differential testing + RL env)"

[features]
oracle-scenario = ["engine/test-support"]

[dependencies]
engine = { path = "../phase/crates/engine", package = "phase-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
im = "15.1"

[[bin]]
name = "oracle-scenario"
path = "src/bin/oracle-scenario.rs"
required-features = ["oracle-scenario"]
