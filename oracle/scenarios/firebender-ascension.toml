[[scenarios]]
name = "F1 enter-the-battlefield creates a firebending Soldier"
active_player = 0
script = [
  { action = "cast", card = "Firebender Ascension" },
  { action = "pass_until_resolved" },
]

[scenarios.setup.P0]
battlefield = [{ label = "mountain-1", card = "Mountain" }, { label = "mountain-2", card = "Mountain" }]
hand = ["Firebender Ascension"]

[scenarios.setup.P1]

[scenarios.reach]
all = [
  { player = "P0", zone = "battlefield", card = "Firebender Ascension", count = 1 },
  { player = "P0", zone = "battlefield", card = "Soldier", types = ["Creature"], subtypes = ["Soldier"], colors = ["R"], power = 2, toughness = 2, count = 1 },
]

