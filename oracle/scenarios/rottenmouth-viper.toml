[[scenarios]]
name = "R1 no cast sacrifice and no unless options"
active_player = 0
script = [
  { action = "cast", card = "Rottenmouth Viper", sacrifice = [] },
  { action = "pass_until_resolved" },
]

[scenarios.setup.P0]
life = 20
battlefield = [
  { label = "swamp-1", card = "Swamp" },
  { label = "swamp-2", card = "Swamp" },
  { label = "swamp-3", card = "Swamp" },
  { label = "swamp-4", card = "Swamp" },
  { label = "swamp-5", card = "Swamp" },
  { label = "swamp-6", card = "Swamp" },
]
hand = ["Rottenmouth Viper"]

[scenarios.setup.P1]
life = 20

[scenarios.reach]
all = [
  { zone = "battlefield", player = "P0", card = "Rottenmouth Viper", counters = { blight = 1 } },
  { zone = "battlefield", player = "P0", card = "Swamp", tapped_labels = ["swamp-1", "swamp-2", "swamp-3", "swamp-4", "swamp-5", "swamp-6"], count = 6 },
]

