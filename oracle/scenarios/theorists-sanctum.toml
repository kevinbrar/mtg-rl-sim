[[scenarios]]
name = "TS1 no Jace enters tapped without a behold prompt"
active_player = 0
script = [{ action = "play_land", card = "sanctum" }]

[scenarios.setup.P0]
hand = [{ card = "Theorist's Sanctum", label = "sanctum" }]

[scenarios.setup.P1]

[scenarios.reach]
all = [
  { zone = "battlefield", player = "P0", card = "Theorist's Sanctum", tapped = true, count = 1 },
  { zone = "hand", player = "P0", card = "Jace Beleren", count = 0 },
]

