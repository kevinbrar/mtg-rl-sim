  { action = "choose_cards", cards = ["selected"] },
  { action = "cast", player = "P0", card = "Feral Encounter" },
  { action = "pass_until_resolved" },
]

[scenarios.setup.P0]
battlefield = [
  { label = "mana.1", card = "Forest" },
  { label = "mana.2", card = "Forest" },
