[[scenarios]]
name = "F5 Feral Encounter deals damage to both scripted targets"
active_player = 0
step = "precombat_main"
script = [
  { action = "choose_cards", cards = ["look.creature"] },
  { action = "cast", player = "P0", card = "Feral Encounter" },
  { action = "pass_until_resolved" },
  { action = "trigger_targets", targets = ["source", "opponent"] },
  { action = "attack", attackers = ["source"], through = "damage" },
  { action = "pass_until_resolved" },
]

[scenarios.setup.P0]
battlefield = [
  { label = "source", card = "Grizzly Bears" },
  { label = "mana.1", card = "Forest" },
  { label = "mana.2", card = "Forest" },
]
hand = ["Feral Encounter"]
library_top = [
  { label = "look.creature", card = "Llanowar Elves" },
  { label = "look.1", card = "Opt" },
  { label = "look.2", card = "Opt" },
  { label = "look.3", card = "Opt" },
  { label = "look.4", card = "Opt" },
]

[scenarios.setup.P1]
battlefield = [{ label = "opponent", card = "Hill Giant" }]
library_top = ["Opt"]

[scenarios.reach]
all = [
  { player = "P1", life = 18 },
  { zone = "battlefield", player = "P1", card = "Hill Giant", count = 1, damage = 2 },
  { zone = "battlefield", player = "P0", card = "Grizzly Bears", count = 1 },
  { zone = "exile", player = "P0", card = "Llanowar Elves", count = 1 },
]

