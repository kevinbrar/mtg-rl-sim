[[scenarios]]
name = "K1 story offers the first equip for zero"
active_player = 1
step = "precombat_main"
script = [
  { action = "next_turn" },
  { action = "activate", source = "equipment-1", ability = "Equip {1}", targets = ["kili"], alternative_cost = "accept" },
  { action = "pass_until_resolved" },
  { action = "activate", source = "equipment-2", ability = "Equip {1}", targets = ["kili"] },
  { action = "pass_until_resolved" },
]
reach = { player = "P0", zone = "battlefield", card = "Bonesplitter", count = 2, attached_to = "kili", tapped_labels = ["plains"] }

[scenarios.setup.P0]
life = 20
battlefield = [
  { label = "kili", card = "Kili the Resourceful" },
  { label = "equipment-1", card = "Bonesplitter" },
  { label = "equipment-2", card = "Bonesplitter" },
  { label = "plains", card = "Plains" },
  { label = "support-creature", card = "Grizzly Bears" },
]
hand = []
library_top = ["Walking Corpse", "Grizzly Bears"]
graveyard = []

[scenarios.setup.P1]
life = 20
