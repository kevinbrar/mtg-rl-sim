# Bitter Triumph {1}{B} Instant
# As an additional cost to cast this spell, discard a card or pay 3 life.
# Destroy target creature or planeswalker.
#
# CR 601.2b + CR 601.2h + CR 119.4: the caster chooses one of the two costs
# and can choose only a cost they can pay. With one payable cost there is no
# choice; with none the spell can't be cast.

[[scenarios]]
name = "BT1 both costs payable, discard chosen"
active_player = 0
script = [
  { action = "choose_cards", cards = ["memnite"] },
  { action = "cast", card = "Bitter Triumph", cost_choice = "first", targets = ["bears"] },
  { action = "pass_until_resolved" },
]

[scenarios.setup.P0]
life = 20
battlefield = [
  { label = "swamp.1", card = "Swamp" },
  { label = "swamp.2", card = "Swamp" },
]
hand = ["Bitter Triumph", { card = "Memnite", label = "memnite" }]

[scenarios.setup.P1]
battlefield = [{ label = "bears", card = "Grizzly Bears" }]

[scenarios.reach]
all = [
  { zone = "graveyard", player = "P1", card = "Grizzly Bears", count = 1 },
  { zone = "graveyard", player = "P0", card = "Bitter Triumph", count = 1 },
  { zone = "graveyard", player = "P0", card = "Memnite", count = 1 },
  { player = "P0", life = 20 },
]

