[[scenarios]]
name = "U1 artifact and creature use exactly three evidence"
active_player = 0
step = "precombat_main"
script = [
  { action = "choose_cards", cards = ["evidence.mv1", "evidence.mv2"] },
  { action = "cast", card = "Urgent Necropsy", targets = ["p1.artifact", "p1.creature"] },
  { action = "pass_until_resolved" },
]
reach = { player = "P1", zone = "graveyard", card = "Bonesplitter", count = 1 }

[scenarios.setup.P0]
battlefield = [
  { label = "land.plains", card = "Plains" },
  { label = "land.island", card = "Island" },
  { label = "land.swamp", card = "Swamp" },
  { label = "land.forest", card = "Forest" },
]
hand = ["Urgent Necropsy"]
library_top = []
graveyard = [
  { label = "evidence.mv1", card = "Bonesplitter" },
  { label = "evidence.mv2", card = "Walking Corpse" },
  { label = "evidence.mv4", card = "Giant Spider" },
]

[scenarios.setup.P1]
battlefield = [
  { label = "p1.artifact", card = "Bonesplitter" },
  { label = "p1.creature", card = "Walking Corpse" },
