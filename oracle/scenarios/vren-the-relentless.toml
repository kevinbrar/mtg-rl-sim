[[scenarios]]
name = "V1 opponent creature exiled creates one Rat"
active_player = 0
step = "precombat_main"
script = [
  { action = "cast", card = "Shock", targets = ["p1-bear"] },
  { action = "pass_until_resolved" },
  { action = "end_turn" },
]
reach = { player = "P0", zone = "battlefield", card = "Rat" }

[scenarios.setup.P0]
life = 20
battlefield = [
  { label = "mountain", card = "Mountain" },
  { label = "vren", card = "Vren, the Relentless" },
]
hand = ["Shock"]
library_top = ["Forest", "Mountain", "Swamp"]
graveyard = []

