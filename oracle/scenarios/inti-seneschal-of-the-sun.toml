# Inti, Seneschal of the Sun {1}{R} Legendary Creature — Human Knight 2/2
# Whenever you attack, you may discard a card. When you do, put a +1/+1 counter
# on target attacking creature. It gains trample until end of turn.
# Whenever you discard one or more cards, exile the top card of your library.
# You may play that card until your next end step.

[[scenarios]]
# CR 603.12: the discard happens, so the reflexive trigger targets the attacker.
# The discard also triggers Inti's second ability. XMage is told to resolve the
# counter first; either order ends in the same state, so the order itself is
# not observable here (N4 and N5 show an order being applied).
# Phase does not ask for this order (STATUS.md), hence only = "xmage".
name = "N1 discarding a card puts a +1/+1 counter on the attacker and exiles the top card"
active_player = 0
script = [
  { action = "choose_optional", answers = ["yes"] },
  { action = "choose_discard", player = "P0", cards = ["fodder"] },
  { action = "trigger_targets", targets = ["inti"] },
  { action = "order_triggers", player = "P0", resolve = ["put a +1/+1 counter", "whenever you discard"], only = "xmage" },
  { action = "attack", attackers = ["inti"] },
  { action = "pass_until_resolved" },
]

[scenarios.setup.P0]
life = 20
hand = [{ label = "fodder", card = "Opt" }]
library_top = ["Mountain", "Island"]
battlefield = [{ label = "inti", card = "Inti, Seneschal of the Sun" }]

[scenarios.setup.P1]
life = 20

[scenarios.reach]
all = [
  { zone = "battlefield", player = "P0", card = "Inti, Seneschal of the Sun", count = 1, counters = { "+1/+1" = 1 } },
  { zone = "graveyard", player = "P0", card = "Opt", count = 1 },
  { zone = "exile", player = "P0", card = "Mountain", count = 1 },
]

[[scenarios]]
# Declining keeps the card; no reflexive trigger and no discard trigger.
name = "N2 declining the discard adds no counter"
