[[scenarios]]
# The same attack with the draw ordered first: the drawn Mountain is discarded
# to Inti, which gets the counter, and the discard trigger exiles the Island.
name = "N5 a draw trigger ordered before Inti's trigger supplies the discard"
active_player = 0
script = [
  { action = "order_triggers", player = "P0", resolve = ["whenever ~ attacks", "whenever you attack"] },
  { action = "choose_optional", answers = ["yes"] },
  { action = "choose_discard", player = "P0", cards = ["drawn"] },
  { action = "trigger_targets", targets = ["inti"] },
  { action = "order_triggers", player = "P0", resolve = ["put a +1/+1 counter", "whenever you discard"], only = "xmage" },
  { action = "attack", attackers = ["inti", "larcenist"] },
  { action = "pass_until_resolved" },
]

