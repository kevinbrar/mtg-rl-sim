[[scenarios]]
# CR 603.3b: the attacking player orders the two attack triggers. Inti's
# resolves first with an empty hand, so no discard is possible; the card
# Library Larcenist draws afterwards stays in hand.
name = "N4 Inti's trigger ordered before a draw trigger finds no card to discard"
active_player = 0
script = [
  { action = "order_triggers", player = "P0", resolve = ["whenever you attack", "whenever ~ attacks"] },
  { action = "attack", attackers = ["inti", "larcenist"] },
  { action = "pass_until_resolved" },
]

[scenarios.setup.P0]
life = 20
hand = []
library_top = ["Mountain", "Island"]
battlefield = [
  { label = "inti", card = "Inti, Seneschal of the Sun" },
  { label = "larcenist", card = "Library Larcenist" },
]

[scenarios.setup.P1]
