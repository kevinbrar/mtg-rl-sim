[[scenarios]]
name = "KV1 exile a nonland card and free-cast it"
active_player = 0
step = "precombat_main"
script = [
  { action = "activate", source = "key", ability = "Equip {2}{U}", targets = ["attacker"] },
  { action = "pass_until_resolved" },
  { action = "choose_cards", cards = ["selected"] },
  { action = "choose_optional", answers = ["yes"] },
  { action = "attack", attackers = ["attacker"], through = "damage" },
  { action = "pass_until_resolved" },
]

[scenarios.setup.P0]
battlefield = [
  { label = "key", card = "The Key to the Vault" },
  { label = "attacker", card = "Grizzly Bears" },
  { label = "mana.1", card = "Island" },
  { label = "mana.2", card = "Island" },
  { label = "mana.3", card = "Island" },
]
library_top = [
  { label = "selected", card = "Divination" },
  { label = "bottom", card = "Island" },
  { label = "draw.one", card = "Forest" },
  { label = "draw.two", card = "Mountain" },
]

[scenarios.setup.P1]

[scenarios.reach]
all = [
  { player = "P1", life = 18 },
  { player = "P0", zone = "battlefield", card = "The Key to the Vault", attached_to = "attacker", count = 1 },
  { zone = "graveyard", player = "P0", card = "Divination", count = 1 },
  { zone = "library", player = "P0", card = "Island", count = 1 },
]

