[[scenarios]]
name = "LM1 X=2 targets one creature per player"
active_player = 0
step = "precombat_main"
script = [
  { action = "trigger_targets", targets = ["p0.target", "p1.target"] },
  { action = "cast", card = "Lost in the Maze", x = 2 },
  { action = "pass_until_resolved" },
]
reach = { player = "P1", zone = "battlefield", card = "Walking Corpse", tapped = true, counters = { stun = 1 }, tapped_labels = ["p0.target", "p1.target"] }

[scenarios.setup.P0]
battlefield = [
  { label = "p0.island", card = "Island" },
  { label = "p0.island.2", card = "Island" },
  { label = "p0.plains", card = "Plains" },
  { label = "p0.swamp", card = "Swamp" },
  { label = "p0.target", card = "Grizzly Bears" },
]
hand = ["Lost in the Maze"]
library_top = ["Island", "Island", "Island", "Island", "Island", "Island", "Island", "Island"]
graveyard = []

[scenarios.setup.P1]
battlefield = [
  { label = "p1.target", card = "Walking Corpse" },
  { label = "p1.untargeted", card = "Grizzly Bears" },
]
hand = []
library_top = ["Island", "Island", "Island", "Island", "Island", "Island", "Island", "Island"]
graveyard = []

