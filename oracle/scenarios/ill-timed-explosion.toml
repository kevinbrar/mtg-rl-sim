[[scenarios]]
# Spirit of the Labyrinth stops the second draw, leaving one card in hand.
# "Discard two cards" cannot be done with one card, so the discard is not
# offered, nothing is discarded and no reflexive trigger fires (CR 603.12).
name = "I4 one card in hand cannot discard two and deals no damage"
active_player = 0
script = [
  { action = "cast", card = "Ill-Timed Explosion" },
  { action = "pass_until_resolved" },
]

[scenarios.setup.P0]
life = 20
hand = ["Ill-Timed Explosion"]
library_top = ["Divination", "Opt", "Island"]
battlefield = [
  { label = "mana.1", card = "Island" },
  { label = "mana.2", card = "Island" },
  { label = "mana.3", card = "Mountain" },
  { label = "mana.4", card = "Mountain" },
]

