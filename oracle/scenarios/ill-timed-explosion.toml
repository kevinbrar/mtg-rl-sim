# Ill-Timed Explosion {2}{U}{R} Sorcery
# Draw two cards. Then you may discard two cards. When you do, Ill-Timed
# Explosion deals X damage to each creature, where X is the greatest mana value
# among cards discarded this way.

[[scenarios]]
# Discarding Divination (MV 3) and Opt (MV 1) deals 3 to each creature.
name = "I1 discard two drawn cards deals greatest mana value to each creature"
active_player = 0
script = [
  { action = "cast", card = "Ill-Timed Explosion" },
  { action = "choose_optional", answers = ["yes"] },
  { action = "choose_discard", player = "P0", cards = ["three", "one"] },
  { action = "pass_until_resolved" },
]

[scenarios.setup.P0]
life = 20
hand = ["Ill-Timed Explosion"]
library_top = [
  { label = "three", card = "Divination" },
  { label = "one", card = "Opt" },
  "Island",
]
battlefield = [
  { label = "mana.1", card = "Island" },
  { label = "mana.2", card = "Island" },
  { label = "mana.3", card = "Mountain" },
  { label = "mana.4", card = "Mountain" },
  { label = "dreadmaw", card = "Colossal Dreadmaw" },
]

[scenarios.setup.P1]
life = 20
battlefield = [{ label = "bears", card = "Grizzly Bears" }]

[scenarios.reach]
all = [
  { zone = "graveyard", player = "P0", card = "Divination", count = 1 },
  { zone = "graveyard", player = "P0", card = "Opt", count = 1 },
  { zone = "graveyard", player = "P1", card = "Grizzly Bears", count = 1 },
  { zone = "battlefield", player = "P0", card = "Colossal Dreadmaw", count = 1, damage = 3 },
]

