[[scenarios]]
name = "RIP1 one Rest in Peace exiles both creatures that trade in combat"
active_player = 0
step = "precombat_main"
script = [
  { action = "attack", attackers = ["attacker"], through = "damage", blocks = [{ blocker = "blocker", attacker = "attacker" }] },
  { action = "pass_until_resolved" },
]

[scenarios.setup.P0]
battlefield = [
  { label = "attacker", card = "Centaur Courser" },
  { label = "rip", card = "Rest in Peace" },
]

[scenarios.setup.P1]
battlefield = [
  { label = "blocker", card = "Centaur Courser" },
]

[scenarios.reach]
all = [
  { zone = "exile", player = "P0", card = "Centaur Courser", count = 1 },
  { zone = "exile", player = "P1", card = "Centaur Courser", count = 1 },
  { zone = "graveyard", player = "P0", card = "Centaur Courser", count = 0 },
  { zone = "graveyard", player = "P1", card = "Centaur Courser", count = 0 },
  { zone = "battlefield", player = "P0", card = "Centaur Courser", count = 0 },
  { zone = "battlefield", player = "P1", card = "Centaur Courser", count = 0 },
  { player = "P0", life = 20 },
  { player = "P1", life = 20 },
]

